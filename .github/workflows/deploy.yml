# MTF 自动构建 APK + Release 发布
# 触发：push 到 main / master，或手动触发
# Secrets（可选）：
#   RELEASE_KEYSTORE_BASE64  release.keystore 的 base64
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Android SDK 组件
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: 设置 Gradle 8.14.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.2'
          cache-read-only: false

      - name: 生成/读取签名
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS:   ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS:     ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KS="${RUNNER_TEMP}/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "✅ 使用 Secrets 中的稳定 keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "STORE_PASS=$STORE_PASS"  >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS"    >> $GITHUB_ENV
            echo "KEY_PASS=$KEY_PASS"      >> $GITHUB_ENV
          else
            echo "⚠️  未配置签名 Secrets，生成临时 keystore"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias mtf \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mtf-ci -keypass mtf-ci \
              -dname "CN=MTF CI, OU=Build, O=CI, C=CN" \
              -noprompt
            echo "STORE_PASS=mtf-ci" >> $GITHUB_ENV
            echo "KEY_ALIAS=mtf"     >> $GITHUB_ENV
            echo "KEY_PASS=mtf-ci"   >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$KS" >> $GITHUB_ENV

      - name: 写入 local.properties
        working-directory: MTF
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          RELEASE_STORE_FILE=$KEYSTORE_PATH
          RELEASE_STORE_PASSWORD=$STORE_PASS
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASS
          EOF

      - name: 构建 Release APK
        working-directory: MTF
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 读取版本号
        id: ver
        working-directory: MTF
        run: |
          VN=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          [ -z "$VN" ] && VN="0.0.0"
          [ -z "$VC" ] && VC="0"
          echo "name=$VN" >> $GITHUB_OUTPUT
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "📦 版本：v$VN (code=$VC)"

      - name: 重命名 APK
        id: apk
        working-directory: MTF
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)
          [ -z "$SRC" ] && SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          DST="mtf-v${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$DST"
          echo "name=$DST" >> $GITHUB_OUTPUT
          ls -lh "$DST"

      - name: 创建 GitHub Release
        working-directory: MTF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "MTF $TAG" \
            --notes "**自动构建**
          - versionName: \`${{ steps.ver.outputs.name }}\`
          - versionCode: \`${{ steps.ver.outputs.code }}\`
          - 构建时间: $(date -u '+%Y-%m-%d %H:%M UTC')
          - 提交: [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          - Android 8.0+ (API 29+)
          " \
            "${{ steps.apk.outputs.name }}"

  cleanup_self:
    name: Cleanup workflow history
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs
        uses: actions/github-script@v7
        with:
          script: |
            const currentRunId = context.runId;
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id !== currentRunId && run.status === 'completed') {
                console.log(`Deleting run ID: ${run.id}`);
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                } catch (e) {
                  console.log(`Failed to delete ${run.id}: ${e.message}`);
                }
              }
            }
